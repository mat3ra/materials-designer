name: Continuous Testing and Automated NPM Publication

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:

  run-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout actions repository
        uses: actions/checkout@v4
        with:
          repository: Exabyte-io/actions
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: actions

      - name: Login to GitHub Container registry
        uses: docker/login-action@v3
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          registry: ghcr.io
          username: $GITHUB_USER
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build and test
        uses: ./.github/workflows/docker-build-test
        with:
          run-test-environment: VITE_USE_JUPYTERLITE_DEV_URL=${{ env.VITE_USE_JUPYTERLITE_DEV_URL || 'false' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        shell: bash -l {0}
        run: npm install --legacy-peer-deps

      # Separate steps so a failure names itself in the run summary instead of both hiding behind
      # one "Run JS tests".
      - name: Run unit tests
        shell: bash -l {0}
        run: npm run test:unit

      # The wheel filenames carry their versions, so the package manifest is a complete cache key.
      # Without this, every run re-downloads them from the jupyterlite deploy — slow, and an outage
      # there would fail builds that have nothing to do with it.
      - name: Cache provisioned REPL wheels
        uses: actions/cache@v4
        with:
          path: public/repl-wheels
          key: repl-wheels-${{ hashFiles('src/components/repl/repl-packages.json') }}

      - name: Run Python REPL integration test (real Pyodide)
        shell: bash -l {0}
        run: |
          npm run provision-repl-wheels
          npm run test:pyodide

      - name: Validate app dockerfile
        uses: ./actions/docker/validate
        with:
          dockerfile: ./dockerfiles/app/Dockerfile

      - name: Validate JS package
        uses: ./actions/js/validate
        with:
          node-version: 20.x
          use-legacy-peer-deps: true

      - name: Validate test dockerfile
        uses: ./actions/docker/validate
        with:
          dockerfile: ./dockerfiles/tests/Dockerfile

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: healthcheck-results-${{ github.run_id }}
          path: |
            tests/cypress/screenshots/
            tests/cypress/videos/
            tests/cypress/results/
          retention-days: 30
          if-no-files-found: ignore

  publish:
    needs: run-tests
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev'

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout actions repository
        uses: actions/checkout@v4
        with:
          repository: Exabyte-io/actions
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: actions

      - name: Publish the application package and create release tag
        uses: ./actions/js/publish
        with:
          node-version: 20.x
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          verify-tests: false
          npm-options: '--legacy-peer-deps'

      - name: Publish tests package
        uses: ./actions/js/publish
        with:
          node-version: 20.x
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          package-directory: ./tests
          verify-tests: false
          publish-tag: false
          npm-options: '--legacy-peer-deps'
