<div class="vtoolbar">
    <button class="tbtn on" title="Select — click, shift-click, drag marquee">@@ICON:cursor@@</button>
    <button class="tbtn" title="Move selected atoms (G)">@@ICON:move@@</button>
    <button class="tbtn" title="Rotate selection (R)">@@ICON:rotate@@</button>
    <span class="tsep"></span>
    <button class="tbtn" title="Add atom">@@ICON:atom-add@@</button>
    <button class="tbtn" title="Clone selected (D)">@@ICON:clone@@</button>
    <button class="tbtn" title="Delete selected (X)">@@ICON:trash@@</button>
    <span class="tsep"></span>
    <button class="tbtn" title="Measure distances / angles (M) — currently: distance">@@ICON:measure@@dist@@ICON:caret@@</button>
    <button class="tbtn on" title="Bonds on/off (B)">@@ICON:bonds@@</button>
    <button class="tbtn" title="Element / coordinate labels — currently: element symbols">@@ICON:labels@@El@@ICON:caret@@</button>
    <button class="tbtn" title="Cell repetitions along a·b·c">@@ICON:grid@@1·1·1</button>
    <span class="tsep"></span>
    <button class="tbtn" title="Camera presets: along a, b, c, [111] — currently: perspective">@@ICON:camera@@persp@@ICON:caret@@</button>
    <button class="tbtn" title="Snapshot / publication figure / GIF">@@ICON:snapshot@@@@ICON:caret@@</button>
    <span class="tspacer"></span>
    <button class="tbtn transform" title="Transform the active material — opens the Catalog">@@ICON:bolt@@Transform@@ICON:caret@@</button>
</div>
