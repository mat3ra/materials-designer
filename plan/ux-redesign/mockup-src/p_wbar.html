<div class="wbar">
    <button class="wbtn icon" title="App menu — file-level actions (Import, Upload, Export, Save, Exit)">@@ICON:menu@@</button>
    <span class="brand" title="Mat3ra Materials Designer — standalone; the embedded costume hides this block">
        <span class="brand-mark">M3</span>
        <span class="brand-name">Materials Designer</span>
    </span>
    <div class="vdiv"></div>
    <div class="session" id="sessionBtn">
        <span class="name">Silicon slab study</span>
        <span class="caret">@@ICON:caret@@</span>
    </div>
    <span class="savechip" id="saveChip"><span class="dot"></span>Saved · 2 min ago</span>
    <div class="vdiv"></div>
    <button class="wbtn icon" title="Undo (⌘Z) — one stack for every surface">@@ICON:undo@@</button>
    <button class="wbtn icon disabled" title="Nothing to redo">@@ICON:redo@@</button>
    <span class="wspacer"></span>
    <div class="searchpill">@@ICON:search@@ Search commands, materials, library… <kbd>⌘K</kbd></div>
    <button class="wbtn ai" title="Assistant (⌘J)">@@ICON:ai@@ Assistant</button>
    <button class="wbtn sendto" title="Hand this material to the platform — the named destinations, not an implied export">@@ICON:send@@ Send to @@ICON:caret@@</button>
    <button class="wbtn primary">Share</button>
    <div class="vdiv"></div>
    <button class="wbtn icon" title="Switch to light theme">@@ICON:theme@@</button>
    <button class="wbtn icon" title="Help, shortcuts (?), tour">@@ICON:help@@</button>
</div>
