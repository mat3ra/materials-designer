        index: 2
    output_materials:
      - name: Ni(111), termination Ni_R-3m_4, Slab, Si Adatom
        index: 3
    feature_name: create_adatom_defect

  - tags: "@notebook_healthcheck"
    notebook_name: create_cluster_sphere.ipynb
    standata_materials:
