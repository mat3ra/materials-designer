template_path: template-tutorials.ftl
feature_path: ../e2e/health_checks/tutorials/
schema:
  $id: "test-case-tutorials-schema"
  tags:
    type: string
    description: Cucumber tags for the feature (e.g. @notebook_healthcheck, @ignore)
  tutorial_notebook_name:
    type: string
    description: Name of the tutorial notebook file
  tutorial_material_name:
    type: string
    description: Name of the tutorial material
  tutorial_material_file_name:
    type: string
    description: Name of the tutorial material file
  tutorial_material_index:
    type: integer
    description: Index of the tutorial material
  feature_name:
    type: string
    description: Name of the feature file without extension

cases:
  - tags: "@notebook_healthcheck"
    tutorial_notebook_name: defect_planar_grain_boundary_2d_boron_nitride.ipynb
    tutorial_material_name: BN(001)-BN(001), Linear Grain Boundary, 9.43 degrees
    tutorial_material_file_name: grain_boundary_2d_boron_nitride.json
    tutorial_material_index: 2
    feature_name: defect_planar_grain_boundary_2d_boron_nitride

  - tags: "@notebook_healthcheck"
    tutorial_notebook_name: defect_planar_grain_boundary_3d_fcc_metals_copper.ipynb
    tutorial_material_name: Cu(-3̂-1̂0)-Cu(310), Grain Boundary
    tutorial_material_file_name: Cu-(3, 1, 0)-(-3, -1, 0)_grain_boundary.json
    tutorial_material_index: 2
    feature_name: defect_planar_grain_boundary_3d_fcc_metals_copper

  - tags: "@notebook_healthcheck"
    tutorial_notebook_name: defect_point_adatom_island_molybdenum_disulfide_platinum.ipynb
    tutorial_material_name: MoS2(001), termination S_P6/mmm_1, Slab, Pt Adatom
    tutorial_material_file_name: MoS2_Pt_island.json
    tutorial_material_index: 2
    feature_name: defect_point_adatom_island_mos2_pt

  - tags: "@notebook_healthcheck"
    tutorial_notebook_name: defect_point_vacancy_boron_nitride.ipynb
    tutorial_material_name: B-vacancy h-BN
    tutorial_material_file_name: B-vacancy_hexagonal_boron_nitride.json
    tutorial_material_index: 2
    feature_name: defect_point_vacancy_boron_nitride

  - tags: "@notebook_healthcheck"
    tutorial_notebook_name: defect_point_substitution_graphene.ipynb
    tutorial_material_name: N-doped Graphene
    tutorial_material_file_name: N-doped_Graphene.json
    tutorial_material_index: 2
    feature_name: defect_point_substitution_graphene

  - tags: "@notebook_healthcheck"
    tutorial_notebook_name: defect_point_pair_gallium_nitride.ipynb
    tutorial_material_name: "GaN, Gallium Nitride, HEX (P6_3mc) 3D (Bulk), mp-804, Pair Defect: Mg + Vac"
    tutorial_material_file_name: Mg substitution and vacancy in GaN.json
    tutorial_material_index: 2
    feature_name: defect_point_pair_gallium_nitride

  - tags: "@notebook_healthcheck"
    tutorial_notebook_name: defect_point_interstitial_tin_oxide.ipynb
    tutorial_material_name: Sn15 O17, Interstitial O Defect
    tutorial_material_file_name: Sn15 O17, Interstitial O Defect.json
    tutorial_material_index: 2
    feature_name: defect_point_interstitial_tin_oxide

  - tags: "@notebook_healthcheck"
    tutorial_notebook_name: defect_surface_step_platinum.ipynb
    tutorial_material_name: Pt(211), termination Pt_Pmmm_4, Slab
    tutorial_material_file_name: Pt_211_step.json
    tutorial_material_index: 2
    feature_name: defect_surface_step_platinum


  # TODO: fix why it takes 40 mins and fails!
  - tags: "@notebook_healthcheck"
    tutorial_notebook_name: defect_surface_island_titanium_nitride.ipynb
    tutorial_material_name: N4Ti4(001), termination TiN_P4/mmm_4, Slab
    tutorial_material_file_name: TiN_slab_with_island.json
    tutorial_material_index: 2
    feature_name: defect_surface_island_titanium_nitride

  - tags: "@notebook_healthcheck"
    tutorial_notebook_name: nanocluster_gold.ipynb
    tutorial_material_name: Au Octahedron
    tutorial_material_file_name: gold_nanocluster_0.json
    tutorial_material_index: 2
    feature_name: nanocluster_gold

  - tags: "@notebook_healthcheck"
    tutorial_notebook_name: optimization_interface_film_xy_position_graphene_nickel.ipynb
    tutorial_material_name: Graphene_Nickel_interface_optimized_xy
    tutorial_material_file_name: Graphene_Nickel_interface_optimized_xy.json
    tutorial_material_index: 2
    feature_name: optimization_interface_film_xy_position_graphene_nickel

    # Takes 11+ mins
  - tags: "@notebook_healthcheck"
    tutorial_notebook_name: interface_bilayer_twisted_nanoribbons_boron_nitride.ipynb
